<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Save - Ad Control Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; color: #f8fafc; padding: 16px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 16px; background: #1e293b; padding: 20px; border-radius: 16px; border: 1px solid #334155; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    h2 { color: #38bdf8; text-align: center; font-size: 1.3rem; margin-bottom: 4px; }
    .status-msg { text-align: center; font-size: 0.9rem; font-weight: bold; padding: 8px; border-radius: 8px; display: none; }
    .success { background: rgba(16, 185, 129, 0.2); color: #10b981; border: 1px solid #10b981; }
    .error { background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid #ef4444; }
    .input-group { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 0.9rem; color: #cbd5e1; font-weight: bold; }
    input, select, textarea { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 12px; color: #f8fafc; font-size: 1rem; outline: none; transition: 0.3s; }
    input:focus, select:focus, textarea:focus { border-color: #38bdf8; }
    .btn-save { background: #0284c7; color: #fff; border: none; padding: 14px; border-radius: 10px; font-weight: bold; font-size: 1.1rem; cursor: pointer; transition: 0.2s; margin-top: 10px; text-align: center; }
    .btn-save:hover { background: #0369a1; }
  </style>
</head>
<body>

  <div class="container">
    <h2>🔒 Ad Control Dashboard</h2>
    <div id="statusMsg" class="status-msg"></div>

    <div class="input-group">
      <label>Start Date</label>
      <input type="date" id="startDate">
    </div>
    <div class="input-group">
      <label>End Date</label>
      <input type="date" id="endDate">
    </div>
    <div class="input-group">
      <label>Company / Brand Name</label>
      <input type="text" id="brandName" placeholder="Ex: Arnav Academy">
    </div>
    <div class="input-group">
      <label>Top Description</label>
      <input type="text" id="topDesc" placeholder="Ex: Special offer banner popup">
    </div>
    <div class="input-group">
      <label>Main Headline (Offer Title)</label>
      <input type="text" id="headline" placeholder="Ex: BUY ONE GET ONE">
    </div>
    <div class="input-group">
      <label>Subtitle / Offer Day</label>
      <input type="text" id="subtitle" placeholder="Ex: SPECIAL OFFER">
    </div>
    <div class="input-group">
      <label>Small Details Text</label>
      <input type="text" id="smallText" placeholder="Ex: limited time campaign validity">
    </div>
    <div class="input-group">
      <label>Bottom Tag (Badge)</label>
      <input type="text" id="bottomTag" placeholder="Ex: SPONSORED">
    </div>
    <div class="input-group">
      <label>Button Text</label>
      <input type="text" id="btnText" placeholder="Ex: Order Now">
    </div>
    <div class="input-group">
      <label>Button Link URL</label>
      <input type="text" id="btnLink" placeholder="Ex: https://yourlink.com">
    </div>

    <button class="btn-save" onclick="saveAdData()">Save & Publish Live 🚀</button>
  </div>

  <script>
    const BIN_ID = "6a72b1edda38895dfebb28b8";
    const MASTER_KEY = "$2a$10$NhgQH1u1DVQXvYdKVtU1.taM5rcDGuuKWJ1JQPdwc1QRtIQvXEm";

    async function fetchCurrentAd() {
      try {
        const response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
          headers: { 'X-Master-Key': MASTER_KEY }
        });
        const data = await response.json();
        if (data && data.record) {
          const ad = data.record;
          document.getElementById('startDate').value = ad.startDate || '';
          document.getElementById('endDate').value = ad.endDate || '';
          document.getElementById('brandName').value = ad.brandName || '';
          document.getElementById('topDesc').value = ad.topDesc || '';
          document.getElementById('headline').value = ad.headline || '';
          document.getElementById('subtitle').value = ad.subtitle || '';
          document.getElementById('smallText').value = ad.smallText || '';
          document.getElementById('bottomTag').value = ad.bottomTag || '';
          document.getElementById('btnText').value = ad.btnText || '';
          document.getElementById('btnLink').value = ad.btnLink || '';
        }
      } catch (err) {
        console.error("Error loading ad data", err);
      }
    }

    async function saveAdData() {
      const msgBox = document.getElementById('statusMsg');
      const adData = {
        startDate: document.getElementById('startDate').value,
        endDate: document.getElementById('endDate').value,
        brandName: document.getElementById('brandName').value,
        topDesc: document.getElementById('topDesc').value,
        headline: document.getElementById('headline').value,
        subtitle: document.getElementById('subtitle').value,
        smallText: document.getElementById('smallText').value,
        bottomTag: document.getElementById('bottomTag').value,
        btnText: document.getElementById('btnText').value,
        btnLink: document.getElementById('btnLink').value
      };

      try {
        const response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'X-Master-Key': MASTER_KEY
          },
          body: JSON.stringify(adData)
        });

        if (response.ok) {
          msgBox.className = "status-msg success";
          msgBox.innerText = "Ad updated and published successfully live! 🚀";
          msgBox.style.display = "block";
        } else {
          throw new Error("Failed");
        }
      } catch (err) {
        msgBox.className = "status-msg error";
        msgBox.innerText = "Failed to update ad. Check connection!";
        msgBox.style.display = "block";
      }
    }

    fetchCurrentAd();
  </script>
</body>
</html>
